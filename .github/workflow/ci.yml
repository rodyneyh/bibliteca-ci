name: Testes-ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
